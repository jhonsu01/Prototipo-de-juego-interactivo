name: Release (APK público + Play Store)

# Se dispara al hacer push de un tag con formato vX.Y.Z (ej: v1.0.3)
#   git tag v1.0.3 && git push origin v1.0.3
# El versionCode se deriva automáticamente y siempre es > 3 (Play ya usó el 3).
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión sin la v (ej: 1.0.3)'
        required: true

permissions:
  contents: write   # crear/borrar releases y tags

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derivar versionName y versionCode
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VNAME="${{ github.event.inputs.version }}"
          else
            VNAME="${GITHUB_REF_NAME#v}"
          fi
          # versionCode monotónico y siempre > 3: base 3 + número de ejecución del workflow
          VCODE=$(( ${{ github.run_number }} + 3 ))
          echo "vname=$VNAME" >> "$GITHUB_OUTPUT"
          echo "vcode=$VCODE" >> "$GITHUB_OUTPUT"
          echo "Version: $VNAME (code $VCODE)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Decodificar keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Construir APK y AAB firmados
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease :app:bundleRelease \
            -PvName="${{ steps.ver.outputs.vname }}" \
            -PvCode="${{ steps.ver.outputs.vcode }}" --no-daemon

      - name: Renombrar artefactos
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/AventureroDelSaber-${{ steps.ver.outputs.vname }}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/AventureroDelSaber-${{ steps.ver.outputs.vname }}.aab"

      - name: Borrar releases y tags anteriores (mantener solo la última)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          KEEP="${GITHUB_REF_NAME}"
          echo "Manteniendo solo: $KEEP"
          for tag in $(gh release list --json tagName --jq '.[].tagName'); do
            if [ "$tag" != "$KEEP" ]; then
              echo "Borrando release y tag $tag"
              gh release delete "$tag" --yes --cleanup-tag || true
            fi
          done

      - name: Publicar nueva release (APK público)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Aventurero del Saber ${{ steps.ver.outputs.vname }}
          make_latest: true
          generate_release_notes: true
          files: |
            dist/AventureroDelSaber-${{ steps.ver.outputs.vname }}.apk

      - name: Desplegar AAB a Google Play (Production)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.jhonsu01.quizgame
          releaseFiles: dist/AventureroDelSaber-${{ steps.ver.outputs.vname }}.aab
          track: production
          status: completed
